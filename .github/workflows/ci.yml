name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  check:
    # 24.04, not ubuntu-latest: latest is 26.04, where Playwright 1.56 cannot install Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Chromium comes from Playwright's own download. Its system packages come from Ubuntu's mirror, which the runner
      # could not reach for hours on Nov 11; the runner image already has what Chromium needs, so that step may fail.
      - run: npx playwright install chromium
      - run: npx playwright install-deps chromium
        continue-on-error: true
        timeout-minutes: 5
      # builds the app against the Supabase Auth stand-in, then runs the browser tests
      - run: npm run test:e2e
