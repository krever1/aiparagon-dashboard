name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  check:
    # 24.04, not ubuntu-latest: latest is 26.04, where Playwright 1.56 cannot install Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      # builds the app against the Supabase Auth stand-in, then runs the browser tests
      - run: npm run test:e2e
